name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: commerce_pilot
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_pilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://commerce:commerce@localhost:5432/commerce_pilot
      RAG_PROVIDER: deterministic
      LLM_PROVIDER: deterministic
      JWT_SECRET_KEY: ci-only-secret-key-at-least-thirty-two-bytes
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install frontend
        run: npm ci --prefix frontend

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy app tests

      - name: Frontend test and type check
        run: |
          npm test --prefix frontend
          npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test with coverage gate
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=85

      - name: Check dependencies
        run: python -m pip check

      - name: Apply and verify migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
